name: publish-to-nuget

on:
  push:
    tags:
      - '**'

permissions:
  contents: read
  id-token: write # issue OIDC token for NuGet trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build packages
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet build AutoLicensing.slnx -c Release -p:Version="$VERSION" --nologo
      - name: Pack packages
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet pack AutoLicensing.slnx -c Release -o packages -p:Version="$VERSION" --no-build --nologo
          # Exclude the Console app package; only the three libraries are published
          rm -f packages/AutoLicensing.Console.*.nupkg

      # Exchange the GitHub OIDC token for a short-lived NuGet API key
      # (https://learn.microsoft.com/en-us/nuget/nuget-org/trusted-publishing)
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }} # your nuget.org profile name, not email

      - name: Push to NuGet
        run: |
          for pkg in packages/*.nupkg; do
            dotnet nuget push "$pkg" \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
